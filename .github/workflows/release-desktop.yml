# The desktop app's direct builds (docs/desktop-app.md, section 11; the steps
# are docs/releasing-desktop.md). After dayGLANCE's release-desktop.yml.
#
# On a v* tag: builds macOS (dmg and zip, Developer ID-signed and notarized
# when the signing secrets are set, ad-hoc otherwise), Windows (nsis) and Linux
# (AppImage and deb), and packs the Stream Deck plugin, then adds them to the
# GitHub release for that tag: uploaded to the release if it already exists (the Android APK's release, for
# instance), else attached to a new draft. A published release stays
# published. The Mac App Store build is made locally (npm run build:electron:mas).
#
# Manual dispatch builds and uploads the artifacts to the run without touching
# any release: the way to try a packaging change before tagging.
name: Release desktop

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    strategy:
      # One platform's failure must not cancel the others.
      fail-fast: false
      matrix:
        include:
          # Pinned, not macos-latest: dayGLANCE's signing broke when that label
          # moved to a newer image (2026-09-07) with no change on its side.
          - os: macos-15
          - os: windows-latest
          - os: ubuntu-latest
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # electron-builder's Electron and tool downloads, kept across runs: the
      # GitHub release host they come from has answered 504 before.
      - name: Cache Electron downloads
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/electron
            ~/.cache/electron-builder
            ~/Library/Caches/electron
            ~/Library/Caches/electron-builder
            ~/AppData/Local/electron/Cache
            ~/AppData/Local/electron-builder/Cache
          key: electron-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - name: Build (macOS, signed and notarized when the secrets are set)
        if: runner.os == 'macOS'
        run: npm run build:electron:release
        env:
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}

      - name: Build (Windows, Linux)
        if: runner.os != 'macOS'
        run: npm run build:electron:release

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: desktop-${{ matrix.os }}
          path: |
            dist-app/*.dmg
            dist-app/*-mac.zip
            dist-app/*.exe
            dist-app/*.AppImage
            dist-app/*.deb
          if-no-files-found: error

  # The Stream Deck plugin, packed once (it is the same file on every
  # platform) and added to the release beside the apps. The Elgato Marketplace
  # submission is a manual step (docs/releasing-desktop.md).
  stream-deck:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            package-lock.json
            stream-deck-plugin/package-lock.json

      - name: Install dependencies
        run: |
          npm ci
          npm ci --prefix stream-deck-plugin

      - name: Build, validate and pack
        working-directory: stream-deck-plugin
        run: |
          npm run build
          npm run validate
          npm run pack

      - name: Upload the plugin
        uses: actions/upload-artifact@v4
        with:
          name: stream-deck-plugin
          path: stream-deck-plugin/dist/com.lastglance.streamdeck.streamDeckPlugin
          if-no-files-found: error

  release:
    needs: [build, stream-deck]
    # Tag pushes only: a manual run is a build-only check.
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Add the files to the tag's release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          shopt -s nullglob
          files=(artifacts/*)
          if [ ${#files[@]} -eq 0 ]; then echo "no artifacts" >&2; exit 1; fi
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$TAG" "${files[@]}" --clobber --repo "$GITHUB_REPOSITORY"
          else
            gh release create "$TAG" "${files[@]}" --draft --title "$TAG" --notes "" --verify-tag --repo "$GITHUB_REPOSITORY"
          fi

name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      - name: Typecheck the desktop shell
        run: npm run build:electron:main

  # The Stream Deck plugin (docs/mcp-and-stream-deck.md, section 6). Its tests
  # run in the checks job with the app's; this builds the bundle, checks its
  # types and the manifest, and packs it. The icon table is generated from the
  # app's own lucide-react, so the root install comes first.
  stream-deck-plugin:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            package-lock.json
            stream-deck-plugin/package-lock.json

      - name: Install the app's dependencies
        run: npm ci

      - name: Install the plugin's dependencies
        working-directory: stream-deck-plugin
        run: npm ci

      - name: Build
        working-directory: stream-deck-plugin
        run: npm run build

      - name: Typecheck
        working-directory: stream-deck-plugin
        run: npm run typecheck

      - name: Validate the manifest
        working-directory: stream-deck-plugin
        run: npm run validate

      - name: Pack
        working-directory: stream-deck-plugin
        run: npm run pack

  # The packaged desktop app, launched for real (docs/desktop-app.md, section
  # 11): the app:// origin, the preload bridge, Dexie, no service worker and the
  # CSP, none of which a unit test can see. Linux only; macOS and Windows
  # packaging is exercised by the release workflow.
  desktop-smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      # electron-builder downloads the Electron binary (a GitHub release asset)
      # into ~/.cache/electron. Cached, the 127 MB zip comes down only when the
      # lockfile changes.
      - name: Cache the Electron download
        uses: actions/cache@v4
        with:
          path: ~/.cache/electron
          key: electron-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
          restore-keys: electron-${{ runner.os }}-

      - name: Install dependencies
        run: npm ci

      # Retried: even with the zip cached, electron-builder fetches Electron's
      # checksum file from GitHub releases, which returned 504s on 2026-11-09.
      # A real build failure fails all three attempts.
      - name: Package the unpacked Linux app
        run: |
          for attempt in 1 2 3; do
            npm run build:electron:dir && exit 0
            echo "::warning::Packaging failed (attempt $attempt of 3)"
            sleep $((attempt * 15))
          done
          exit 1

      # The Claude Desktop setup ships in direct builds and not in the Mac App
      # Store one (docs/mcp-and-stream-deck.md, section 7). The MAS build is
      # made on a Mac (npm run build:electron:mas) and checked there with --mas.
      - name: Check the direct build carries the Claude Desktop setup
        run: node scripts/verify-mas-compileout.mjs --direct dist-app/linux-unpacked/resources

      - name: Smoke test
        env:
          SMOKE_SCREENSHOT: desktop-smoke.png
        run: xvfb-run -a npm run test:electron-smoke

      - name: Upload the screenshot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: desktop-smoke
          path: desktop-smoke.png
          if-no-files-found: ignore

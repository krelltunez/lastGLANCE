name: iOS

# Compiles the iOS app on every PR that can affect it: a Swift typo, a project
# file Xcode no longer accepts, or a package that stops resolving used to reach
# a compiler only when someone opened Xcode. Build-only: no code signing, no
# simulator run, no upload. Mirrors lifeGLANCE's iOS build job.
#
# The web build and `cap sync ios` come first because the App target bundles
# the synced web assets and capacitor.config.json, and CapApp-SPM resolves the
# Capacitor plugins from node_modules. `npm run build:ios` is the developer
# path, so it also writes ios/version.generated.xcconfig, which both xcconfigs
# include; IOS_BUILD only needs to be a valid build number here, since nothing
# is uploaded. The RevenueCat xcframework carries a simulator slice.
on:
  pull_request:
    paths:
      - 'ios/**'
      - 'src/**'
      - 'public/**'
      - 'scripts/**'
      - 'package.json'
      - 'package-lock.json'
      - 'capacitor.config.ts'
      - '.github/workflows/ios.yml'
  push:
    branches: [main]
    paths:
      - 'ios/**'
      - 'src/**'
      - 'public/**'
      - 'scripts/**'
      - 'package.json'
      - 'package-lock.json'
      - 'capacitor.config.ts'
      - '.github/workflows/ios.yml'
  workflow_dispatch:

concurrency:
  group: ios-${{ github.head_ref || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    # Xcode is macOS-only; macos-15 carries Xcode 16 or later.
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select latest Xcode
        run: sudo xcode-select -s "$(ls -d /Applications/Xcode_*.app | sort -V | tail -1)"

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          # The Capacitor CLI (`cap sync`) requires Node 22 or later.
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build the web app and sync Capacitor
        run: npm run build:ios
        env:
          IOS_BUILD: ${{ github.run_number }}

      # Swift packages are resolved on their own, with retries. The binary
      # targets (Capacitor, Cordova, RevenueCat) download from GitHub release
      # assets, and when a download fails SwiftPM leaves the partial file
      # behind and its own retry reports "already exists in file system". On
      # 2026-11-09 this failed the build before it compiled on PRs #421 and
      # #422 and on main, including in a cache that started empty, while
      # GitHub release downloads were also returning 504 to electron-builder.
      # Each retry clears the partial downloads first; a real resolution error
      # (a bad version, a missing package) fails all three attempts. The cache
      # lives under RUNNER_TEMP so the retry knows exactly what to clear.
      - name: Resolve Swift packages
        run: |
          for attempt in 1 2 3; do
            if xcodebuild -resolvePackageDependencies \
                -project ios/App/App.xcodeproj \
                -scheme App \
                -packageCachePath "$RUNNER_TEMP/spm-cache"; then
              exit 0
            fi
            echo "::warning::Swift package resolution failed (attempt $attempt of 3); clearing partial downloads"
            rm -rf "$RUNNER_TEMP/spm-cache/artifacts"
            sleep $((attempt * 20))
          done
          exit 1

      - name: Build the iOS app (no signing)
        run: |
          xcodebuild build \
            -project ios/App/App.xcodeproj \
            -scheme App \
            -configuration Debug \
            -destination 'generic/platform=iOS Simulator' \
            -packageCachePath "$RUNNER_TEMP/spm-cache" \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO
